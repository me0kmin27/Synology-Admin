<!doctype html><html lang="ko"><meta charset="utf-8"><title>채팅 #{{ conversation.pk }}</title>
<h1>채팅 #{{ conversation.pk }} — 준실시간</h1>
<p>3초 간격 자동 갱신. 접속/읽음 상태 아님. 첨부파일은 지원하지 않습니다.</p>
<p>이 화면은 최근 수신한 최대 500개를 표시합니다. 새로 열면 처음부터 순서대로 가져옵니다.</p>
<p id="transport" role="status">메시지 불러오는 중</p>
<ol id="messages" aria-live="polite" style="white-space:pre-wrap"></ol>
<form id="send" method="post" action="events/">{% csrf_token %}
<label>메시지 <textarea name="body" maxlength="2000" required></textarea></label>
<button>보내기</button></form><p id="send-status" role="status"></p>
<noscript>자동 채팅에는 JavaScript가 필요합니다.</noscript>
<a href="/chat/">대화 목록</a>
<script>
(() => {
  const form = document.querySelector('#send');
  const body = form.elements.body;
  const button = form.querySelector('button');
  const list = document.querySelector('#messages');
  const transport = document.querySelector('#transport');
  const sendStatus = document.querySelector('#send-status');
  const endpoint = form.action;
  let cursor = '0', rendered = 0n, stopped = false, delay = 3000, pending = null;
  function stop() {
    stopped = true;
    list.replaceChildren();
    body.value = '';
    body.disabled = button.disabled = true;
    transport.textContent = '권한 또는 세션이 종료되었습니다. 다시 로그인하세요.';
  }
  async function request(url, options = {}) {
    const response = await fetch(url, {...options, credentials: 'same-origin', cache: 'no-store', signal: AbortSignal.timeout(10000)});
    if (response.redirected || [401, 403, 404].includes(response.status)) { stop(); throw new Error('auth'); }
    return response;
  }
  async function poll() {
    if (stopped) return;
    try {
      const response = await request(endpoint + '?after=' + encodeURIComponent(cursor));
      if (!response.ok) {
        if (response.status === 429) delay = Math.max(3000, Number(response.headers.get('Retry-After')) * 1000);
        throw new Error('retry');
      }
      const page = await response.json();
      if (stopped) return;
      for (const message of page.messages) {
        const id = BigInt(message.id);
        if (id <= rendered) continue;
        const li = document.createElement('li');
        li.textContent = message.author + ' · ' + message.created_at + '\n' + message.body;
        list.append(li);
        rendered = id;
        if (list.children.length > 500) list.firstElementChild.remove();
      }
      cursor = page.cursor; // Only advance after this whole page has been rendered.
      delay = 3000;
      transport.textContent = page.has_more ? '이전 메시지 불러오는 중' : '자동 갱신 중 (3초 간격)';
    } catch (_) {
      if (!stopped) {
        transport.textContent = '연결 중단 — 자동 재연결 대기 중';
        delay = Math.min(60000, Math.max(6000, delay * 2));
      }
    } finally {
      if (!stopped) setTimeout(poll, delay); // No overlapping polls or catch-up flood.
    }
  }
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (stopped || button.disabled) return;
    if (!pending) pending = {body: body.value, nonce: crypto.randomUUID()};
    button.disabled = true;
    body.readOnly = true;
    try {
      const data = new URLSearchParams({...pending, csrfmiddlewaretoken: form.elements.csrfmiddlewaretoken.value});
      const response = await request(endpoint, {method: 'POST', body: data});
      if (!response.ok) {
        if ([400, 409].includes(response.status)) { pending = null; body.readOnly = false; }
        sendStatus.textContent = response.status === 429 ? '전송 제한입니다. 잠시 후 같은 메시지를 재시도하세요.' : '전송 실패. 같은 메시지를 재시도하세요.';
        return;
      }
      // Do not move the receive cursor: concurrent messages may precede our send.
      pending = null;
      body.value = '';
      body.readOnly = false;
      sendStatus.textContent = '전송됨';
    } catch (_) {
      if (!stopped) sendStatus.textContent = '확인되지 않았습니다. 같은 메시지를 재시도하세요 (중복 전송 방지).';
    } finally {
      if (!stopped) button.disabled = false;
    }
  });
  poll();
})();
</script></html>
