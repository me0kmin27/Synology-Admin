<!doctype html><html lang="ko"><meta charset="utf-8"><title>관리자 OTP</title>
<h1>관리자 OTP</h1>
{% if seed %}<p>인증 앱에 직접 입력하세요. TOTP / SHA1 / 6자리 / 30초</p><code id="otp-seed">{{ seed }}</code>{% endif %}
{% if enroll %}<form method="post">{% csrf_token %}<label>현재 비밀번호 <input type="password" name="password" autocomplete="current-password" required></label><button>등록 시작</button></form>
{% else %}<form method="post" action="/mfa/verify/">{% csrf_token %}<label>OTP <input name="token" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></label><button>OTP 확인</button></form>{% endif %}
<form method="post" action="/logout/">{% csrf_token %}<button>로그아웃</button></form></html>
