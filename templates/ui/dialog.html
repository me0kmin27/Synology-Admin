<dialog id="portal-dialog" aria-labelledby="dialog-title">
  <div class="dialog-toolbar"><strong id="dialog-title">상세</strong><button type="button" id="dialog-close" class="secondary" autofocus>닫기</button></div>
  <p id="dialog-status" role="alert" tabindex="-1"></p>
  <div id="dialog-content"></div>
  <a id="dialog-fallback" href="/account/">전체 페이지에서 열기</a>
</dialog>
<script id="portal-dialog-script">
(() => {
  const dialog = document.getElementById('portal-dialog');
  if (!dialog.showModal || !window.fetch) return;
  const content = document.getElementById('dialog-content');
  const status = document.getElementById('dialog-status');
  const close = document.getElementById('dialog-close');
  const fallback = document.getElementById('dialog-fallback');
  let opener, controller, generation = 0, busy = false, submitting = false, uncertain = false, navigating = false;
  window.addEventListener('beforeunload', event => {
    if (submitting && !navigating) { event.preventDefault(); event.returnValue = ''; }
  });
  close.addEventListener('click', () => { if (!submitting) dialog.close(); });
  dialog.addEventListener('cancel', event => { if (submitting) event.preventDefault(); });
  dialog.addEventListener('click', event => {
    if (submitting && event.target.closest('a')) event.preventDefault();
  });
  dialog.addEventListener('keydown', event => {
    if (event.key !== 'Tab') return;
    const targets = [...dialog.querySelectorAll('a[href],button,input:not([type=hidden]),select,textarea,[tabindex="0"]')]
      .filter(node => !node.disabled && node.getClientRects().length);
    const first = targets[0], last = targets[targets.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault(); last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault(); first.focus();
    }
  });
  dialog.addEventListener('close', () => {
    generation++;
    controller?.abort();
    content.replaceChildren();
    status.textContent = '';
    busy = false;
    opener?.focus();
  });
  function renderPage(html, url) {
    const page = new DOMParser().parseFromString(html, 'text/html');
    const main = page.querySelector('#main-content');
    if (!main) return false;
    main.querySelectorAll('script').forEach(node => node.remove());
    main.querySelectorAll('form').forEach(form => {
      form.action = new URL(form.getAttribute('action') || url, url).href;
    });
    main.querySelectorAll('a[href]').forEach(link => {
      link.href = new URL(link.getAttribute('href'), url).href;
    });
    document.getElementById('dialog-title').textContent = main.querySelector('h1')?.textContent || '상세';
    content.replaceChildren(...main.childNodes);
    return true;
  }
  async function load(url, options = {}, submitted = false) {
    const current = ++generation;
    controller?.abort();
    controller = new AbortController();
    status.textContent = submitted ? '저장 중입니다. 완료될 때까지 기다려 주세요.' : '불러오는 중…';
    busy = true;
    submitting = submitted;
    try {
      const response = await fetch(url, {...options, credentials: 'same-origin', cache: 'no-store', signal: controller.signal});
      if (current !== generation) return;
      if (response.redirected) {
        navigating = true;
        window.location.assign(response.url);
        return;
      }
      const html = await response.text();
      if (current !== generation || !dialog.open) return;
      if ((response.ok || response.status === 400) && renderPage(html, response.url)) {
        status.textContent = '';
        if (submitted) {
          const error = content.querySelector('.errorlist');
          if (error) { error.tabIndex = -1; error.focus(); }
        }
      } else {
        uncertain = submitted && response.status >= 500;
        status.textContent = uncertain ? `저장 결과를 확인할 수 없습니다 (${response.status}). 중복 제출하지 말고 목록에서 반영 여부를 확인하세요.` : `요청을 처리하지 못했습니다 (${response.status}). 권한·입력값을 확인하거나 전체 페이지에서 다시 시도하세요.`;
        status.focus();
      }
    } catch (error) {
      if (error.name !== 'AbortError' && current === generation) {
        uncertain = submitted;
        status.textContent = submitted ? '저장 결과를 확인할 수 없습니다. 중복 제출하지 말고 창을 닫아 목록에서 반영 여부를 확인하세요.' : '연결에 실패했습니다. 전체 페이지에서 다시 시도하세요.';
        status.focus();
      }
    } finally {
      if (current === generation && !navigating) { busy = false; submitting = false; }
    }
  }
  document.addEventListener('click', event => {
    const link = event.target.closest('a[data-modal]');
    if (!link || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || dialog.open) return;
    const url = new URL(link.href);
    if (url.origin !== location.origin) return;
    event.preventDefault();
    opener = link;
    uncertain = false;
    fallback.href = url.href;
    content.replaceChildren();
    dialog.showModal();
    close.focus();
    load(url.href);
  });
  dialog.addEventListener('submit', event => {
    const form = event.target;
    if (form.method.toLowerCase() !== 'post' || new URL(form.action).origin !== location.origin) return;
    event.preventDefault();
    if (busy || uncertain) return;
    load(form.action, {method: 'POST', body: new FormData(form)}, true);
  });
})();
</script>
