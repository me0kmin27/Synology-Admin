name: portal-ui
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  packaged-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - name: Build unchanged production Dockerfile
        run: docker build --build-arg SOURCE_REVISION=${{ github.sha }} -t portal-ui-test .
      - name: Start isolated disposable UI smoke runtime
        run: |
          mkdir -p "$RUNNER_TEMP/portal-ui-state"
          chmod 0777 "$RUNNER_TEMP/portal-ui-state"
          export DJANGO_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(64))')
          docker run -d --name portal-ui-test -p 127.0.0.1:18081:8000 \
            -e DJANGO_SECRET_KEY -e DJANGO_LOCAL_HTTP=1 \
            -e DJANGO_ALLOW_UNSAFE_SQLITE=1 -e DJANGO_DB_PATH=/state/test.sqlite3 \
            -v "$RUNNER_TEMP/portal-ui-state:/state" portal-ui-test \
            sh -c 'python manage.py migrate --noinput && exec gunicorn --config deploy/gunicorn.conf.py config.wsgi:application'
          python -c '
          import time, urllib.request
          for attempt in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:18081/health/", timeout=2) as response:
                      assert response.status == 200
                  break
              except (OSError, AssertionError):
                  time.sleep(1)
          else:
              raise SystemExit("UI smoke runtime did not become healthy")
          '
      - name: Chromium verifies packaged CSS and public forms
        run: python browser_tests/portal_container.py
      - name: Clean up disposable runtime
        if: always()
        run: docker rm -f portal-ui-test || true
